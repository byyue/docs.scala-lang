[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pokemon-tcg-ai-battle"
version = "0.22.0"
description = "Continuous data-driven agent evolution for Kaggle Pokémon TCG AI Battle"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary project code; vendored competition runtime retains its upstream terms"}
authors = [{name = "Boyang Yue"}]
dependencies = [
  "numpy>=2.0,<3",
  "orjson>=3.10,<4",
  "PyYAML>=6.0,<7",
  "scipy>=1.14,<2",
  "scikit-learn>=1.5,<2",
  "torch>=2.5,<3",
  "safetensors>=0.5,<1",
]

[project.optional-dependencies]
data = ["duckdb>=1.2", "pyarrow>=18", "polars>=1.20"]
ml = ["numpy>=2.0", "scikit-learn>=1.5", "torch>=2.5", "safetensors>=0.5"]
dev = ["ruff>=0.9", "mypy>=1.14", "coverage>=7.6"]

[project.scripts]
ptcg = "ptcg.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
