name: ptcg-v022-resolve-lock
on:
  push:
    branches: [main]
    paths:
      - ptcg-v022-lock/pyproject.toml
      - .github/workflows/ptcg-v022-resolve-lock.yml
  workflow_dispatch:
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.10.0
      - name: Resolve exact v0.22 lock
        working-directory: ptcg-v022-lock
        run: |
          touch README.md
          mkdir -p src
          uv lock --python 3.13
          uv lock --check --python 3.13
          python - <<'PY'
          import tomllib
          from pathlib import Path
          lock = tomllib.loads(Path('uv.lock').read_text())
          required = {'numpy', 'orjson', 'pyyaml', 'scipy', 'scikit-learn', 'torch', 'safetensors', 'duckdb', 'pyarrow', 'polars', 'ruff', 'mypy', 'coverage'}
          present = {row['name'] for row in lock.get('package', [])}
          missing = sorted(required - present)
          if missing:
              raise SystemExit(f'missing locked distributions: {missing}')
          print(f'verified {len(present)} locked package names')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ptcg-v022-exact-uv-lock
          path: ptcg-v022-lock/uv.lock
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
