name: Delete temporary ROGII transport branch

on:
  push:
    branches:
      - chatgpt-rogii-truth-transport-20260806
    paths:
      - .github/workflows/chatgpt-rogii-truth-transport.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete isolated temporary branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TEMP_BRANCH: chatgpt-rogii-truth-transport-20260806
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X DELETE \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/heads/${TEMP_BRANCH}"
          echo "Deleted ${TEMP_BRANCH} without merging it."
