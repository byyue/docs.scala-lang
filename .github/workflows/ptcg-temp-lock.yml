name: ptcg-temp-lock
on:
  push:
    branches: [main]
    paths: [.github/workflows/ptcg-temp-lock.yml]
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover and verify lock
        run: |
          curl --fail --silent --show-error --location https://paste.rs/FsEit -o PTCG_TEMP_UV_LOCK
          echo 'cf6a5b390acfbdaf09b914eb24182c96c40a8f5ba4e11de748beeab85c4cd494  PTCG_TEMP_UV_LOCK' | sha256sum -c -
          test "$(wc -c < PTCG_TEMP_UV_LOCK)" -eq 258133
      - name: Commit verified lock
        run: |
          git config user.name ptcg-lock-bot
          git config user.email ptcg-lock-bot@users.noreply.github.com
          git add PTCG_TEMP_UV_LOCK
          git commit -m 'Temporarily publish verified v0.21.1 uv lock'
          git push origin HEAD:main
