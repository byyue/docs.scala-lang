name: ptcg-temp-lock
on:
  push:
    branches: [main]
    paths: [.github/workflows/ptcg-temp-lock.yml]
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify committed lock
        run: |
          echo 'cf6a5b390acfbdaf09b914eb24182c96c40a8f5ba4e11de748beeab85c4cd494  PTCG_TEMP_UV_LOCK' | sha256sum -c -
          test "$(wc -c < PTCG_TEMP_UV_LOCK)" -eq 258133
      - uses: actions/upload-artifact@v4
        with:
          name: ptcg-v0211-uv-lock
          path: PTCG_TEMP_UV_LOCK
          if-no-files-found: error
          retention-days: 1
      - name: Publish temporary release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp PTCG_TEMP_UV_LOCK uv.lock
          if gh release view ptcg-v0211-lock >/dev/null 2>&1; then
            gh release upload ptcg-v0211-lock uv.lock --clobber
          else
            gh release create ptcg-v0211-lock uv.lock \
              --target main \
              --title 'Temporary verified PTCG v0.21.1 lock' \
              --notes 'Temporary transfer asset; SHA-256 cf6a5b390acfbdaf09b914eb24182c96c40a8f5ba4e11de748beeab85c4cd494.'
          fi
