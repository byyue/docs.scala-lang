name: ptcg-temp-lock-cleanup
on:
  push:
    branches: [main]
    paths: [.github/workflows/ptcg-temp-lock.yml]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete ptcg-v0211-lock --yes --cleanup-tag || true
